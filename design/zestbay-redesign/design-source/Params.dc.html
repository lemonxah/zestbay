<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plugin parameters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#121418}
a{color:#c9e265;text-decoration:none}a:hover{color:#e3f29a;text-decoration:underline}
input::placeholder{color:#7b8390}
button{cursor:pointer}
input[type=range]{cursor:pointer}
</style>
</helmet>
<div style="width: 600px; height: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #1a1d23; color: #e8eaee; border: 1px solid #2a2f38; border-radius: 12px; overflow: hidden; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 13px; line-height: 1.3">

  <div style="display: flex; align-items: flex-start; gap: 16px; padding: 20px 24px 12px">
    <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0">
      <span style="width: 28px; height: 28px; border-radius: 7px; background: rgba(167,139,250,0.16); color: #a78bfa; display: flex; align-items: center; justify-content: center; flex: none"><svg width="16" height="16" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 1v3M8 1v3M2.5 4h7v1.5a3.5 3.5 0 0 1-7 0zM6 9v2"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <h1 style="margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">LSP Mixer x4 Stereo</h1>
        <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: #8b93a0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><a href="http://lsp-plug.in/plugins/lv2/mixer_x4_stereo" style="color: #8b93a0">lsp-plug.in/plugins/lv2/mixer_x4_stereo</a></span>
      </div>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 500; color: #aab1bc; height: 32px">Bypass
      <button type="button" role="switch" aria-checked="false" aria-label="Bypass plugin" style="width: 40px; height: 22px; border-radius: 11px; border: 0; padding: 0; position: relative; background: #2f353f"><span style="position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #9aa1ad"></span></button>
    </label>
    <button type="button" aria-label="Close" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #8b93a0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 0 24px 12px">
    <label style="display: flex; align-items: center; gap: 8px; height: 32px; flex: 1; box-sizing: border-box; padding: 0 10px; background: #121418; border: 1px solid #2a2f38; border-radius: 8px; color: #8b93a0">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="6" r="4.2"></circle><path d="M9.2 9.2L12.5 12.5"></path></svg>
      <input type="search" placeholder="Filter parameters" aria-label="Filter parameters" style="flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: #e8eaee; font: inherit; font-size: 12px">
    </label>
    <span style="font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 11px; color: #8b93a0">34 parameters</span>
    <button type="button" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid #2f353f; background: #22262e; color: #e8eaee; font: inherit; font-size: 12px; font-weight: 500">Reset all</button>
  </div>

  <div style="flex: 1; min-height: 0; margin: 0 24px 24px; background: #1f232a; border: 1px solid #2a2f38; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column">

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #262b33">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="p-enabled" style="flex: 1; font-weight: 500">Enabled</label>
        <input id="p-enabled-value" type="text" value="1.000" aria-label="Enabled value" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 8px; text-align: right; background: #121418; border: 1px solid #2f353f; border-radius: 6px; color: #e8eaee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; outline: 0">
        <button type="button" aria-label="MIDI learn" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500">MIDI</button>
        <button type="button" aria-label="Reset to default" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2.5v2.5H5"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button id="p-enabled" type="button" role="switch" aria-checked="true" style="width: 32px; height: 18px; border-radius: 9px; border: 0; padding: 0; position: relative; background: {{accent}}"><span style="position: absolute; top: 2px; left: 16px; width: 14px; height: 14px; border-radius: 50%; background: #141413"></span></button>
        <span style="font-size: 12px; color: #aab1bc">On</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #262b33">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="p-mono" style="flex: 1; font-weight: 500">Mono output</label>
        <input type="text" value="0.000" aria-label="Mono output value" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 8px; text-align: right; background: #121418; border: 1px solid #2f353f; border-radius: 6px; color: #e8eaee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; outline: 0">
        <button type="button" aria-label="MIDI learn" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500">MIDI</button>
        <button type="button" aria-label="Reset to default" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2.5v2.5H5"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button id="p-mono" type="button" role="switch" aria-checked="false" style="width: 32px; height: 18px; border-radius: 9px; border: 0; padding: 0; position: relative; background: #2f353f"><span style="position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #9aa1ad"></span></button>
        <span style="font-size: 12px; color: #aab1bc">Off</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #262b33">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="p-balance" style="flex: 1; font-weight: 500">Output balance</label>
        <input type="text" value="0.000" aria-label="Output balance value" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 8px; text-align: right; background: #121418; border: 1px solid #2f353f; border-radius: 6px; color: #e8eaee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; outline: 0">
        <button type="button" aria-label="MIDI learn" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500">MIDI</button>
        <button type="button" aria-label="Reset to default" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2.5v2.5H5"></path></svg></button>
      </div>
      <input id="p-balance" type="range" min="-1" max="1" step="0.001" value="0" style="width: 100%; margin: 0; accent-color: {{accent}}">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; color: #8b93a0"><span>L -1.000</span><span>R 1.000</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #262b33">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="p-dry" style="flex: 1; font-weight: 500">Dry amount</label>
        <input type="text" value="1.000" aria-label="Dry amount value" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 8px; text-align: right; background: #121418; border: 1px solid #2f353f; border-radius: 6px; color: #e8eaee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; outline: 0">
        <button type="button" aria-label="MIDI learn" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500">MIDI</button>
        <button type="button" aria-label="Reset to default" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2.5v2.5H5"></path></svg></button>
      </div>
      <input id="p-dry" type="range" min="0" max="10" step="0.001" value="1" style="width: 100%; margin: 0; accent-color: {{accent}}">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; color: #8b93a0"><span>0.000</span><span>10.000</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #262b33">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="p-wet" style="flex: 1; font-weight: 500">Wet amount</label>
        <input type="text" value="1.000" aria-label="Wet amount value" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 8px; text-align: right; background: #121418; border: 1px solid #2f353f; border-radius: 6px; color: #e8eaee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; outline: 0">
        <button type="button" aria-label="MIDI learn" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500">MIDI</button>
        <button type="button" aria-label="Reset to default" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2.5v2.5H5"></path></svg></button>
      </div>
      <input id="p-wet" type="range" min="0" max="10" step="0.001" value="1" style="width: 100%; margin: 0; accent-color: {{accent}}">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; color: #8b93a0"><span>0.000</span><span>10.000</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #262b33">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="p-gain" style="flex: 1; font-weight: 500">Output gain</label>
        <input type="text" value="1.000" aria-label="Output gain value" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 8px; text-align: right; background: #121418; border: 1px solid #2f353f; border-radius: 6px; color: #e8eaee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; outline: 0">
        <button type="button" aria-label="MIDI learn" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500">MIDI</button>
        <button type="button" aria-label="Reset to default" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2.5v2.5H5"></path></svg></button>
      </div>
      <input id="p-gain" type="range" min="0" max="4" step="0.001" value="1" style="width: 100%; margin: 0; accent-color: {{accent}}">
      <div style="display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; color: #8b93a0"><span>0.000</span><span>4.000</span></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="p-solo1" style="flex: 1; font-weight: 500">Channel solo 1</label>
        <input type="text" value="0.000" aria-label="Channel solo 1 value" style="width: 64px; height: 26px; box-sizing: border-box; padding: 0 8px; text-align: right; background: #121418; border: 1px solid #2f353f; border-radius: 6px; color: #e8eaee; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; outline: 0">
        <button type="button" aria-label="MIDI learn" style="height: 26px; padding: 0 8px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; font-weight: 500">MIDI</button>
        <button type="button" aria-label="Reset to default" style="width: 26px; height: 26px; border-radius: 6px; border: 1px solid #2f353f; background: #22262e; color: #aab1bc; display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 7a4.5 4.5 0 1 0 1.3-3.2M2.5 2.5v2.5H5"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button id="p-solo1" type="button" role="switch" aria-checked="false" style="width: 32px; height: 18px; border-radius: 9px; border: 0; padding: 0; position: relative; background: #2f353f"><span style="position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #9aa1ad"></span></button>
        <span style="font-size: 12px; color: #aab1bc">Off</span>
      </div>
    </div>

  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c9e265","options":["#c9e265","#63b3ff","#f0a040","#e879b5"]},"$preview":{"width":600,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c9e265' };
  }
}
</script>
</body>
</html>
