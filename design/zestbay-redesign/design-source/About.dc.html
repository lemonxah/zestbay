<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>About ZestBay</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0;background:#121418}
a{color:#c9e265;text-decoration:none}a:hover{color:#e3f29a;text-decoration:underline}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 420px; height: 380px; box-sizing: border-box; display: flex; flex-direction: column; background: #1a1d23; color: #e8eaee; border: 1px solid #2a2f38; border-radius: 12px; overflow: hidden; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 13px; line-height: 1.3">

  <div style="display: flex; justify-content: flex-end; padding: 12px 12px 0">
    <button type="button" aria-label="Close" style="width: 32px; height: 32px; border-radius: 8px; border: 0; background: transparent; color: #8b93a0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 32px 20px; text-align: center">
    <svg width="48" height="48" viewBox="0 0 22 22" role="img" aria-label="ZestBay logo"><circle cx="11" cy="11" r="9" fill="{{accent}}"></circle><path d="M11 11V2A9 9 0 0 1 20 11Z" fill="#121418" opacity="0.6"></path><circle cx="11" cy="11" r="2.2" fill="#121418"></circle></svg>
    <h1 style="margin: 8px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">ZestBay</h1>
    <p style="margin: 0; font-size: 13px; color: #8b93a0">A PipeWire patchbay and plugin host</p>
  </div>

  <div style="margin: 0 24px; background: #1f232a; border: 1px solid #2a2f38; border-radius: 10px; display: grid; grid-template-columns: 96px minmax(0, 1fr); row-gap: 0; column-gap: 12px; padding: 4px 16px">
    <span style="padding: 9px 0; font-size: 12px; color: #8b93a0; border-bottom: 1px solid #262b33">Version</span><span style="padding: 9px 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; border-bottom: 1px solid #262b33">0.8.7</span>
    <span style="padding: 9px 0; font-size: 12px; color: #8b93a0; border-bottom: 1px solid #262b33">Qt</span><span style="padding: 9px 0; font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 12px; border-bottom: 1px solid #262b33">6.12.0</span>
    <span style="padding: 9px 0; font-size: 12px; color: #8b93a0; border-bottom: 1px solid #262b33">Author</span><span style="padding: 9px 0; font-size: 12px; border-bottom: 1px solid #262b33">lemonxah</span>
    <span style="padding: 9px 0; font-size: 12px; color: #8b93a0; border-bottom: 1px solid #262b33">Source</span><span style="padding: 9px 0; font-size: 12px; border-bottom: 1px solid #262b33; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><a href="https://github.com/lemonxah/zestbay">github.com/lemonxah/zestbay</a></span>
    <span style="padding: 9px 0; font-size: 12px; color: #8b93a0">License</span><span style="padding: 9px 0; font-size: 12px">MIT</span>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#c9e265","options":["#c9e265","#63b3ff","#f0a040","#e879b5"]},"$preview":{"width":420,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#c9e265' };
  }
}
</script>
</body>
</html>
