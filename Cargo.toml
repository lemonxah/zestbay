[package]
name = "zestbay"
version = "1.2.11"
edition = "2024"
rust-version = "1.88"
description = "A PipeWire patchbay application"
authors = ["Ryno Kotze <lemon.xah@gmail.com>"]
license = "MIT"

[dependencies]
cxx = "1.0"
cxx-qt = "0.8"
cxx-qt-lib = { version = "0.8", features = ["qt_full"] }

pipewire = "0.9"
libspa = "0.9"

lilv = "0.2"
lv2_raw = "0.3"

clap-sys = "0.5"

vst3 = "0.3"

parking_lot = "0.12"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

ksni = { version = "0.3", features = ["blocking"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

libc = "0.2"

log = "0.4"
env_logger = "0.11"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rtrb = "0.3"

rosc = "0.10"

[workspace]
members = [".", "crates/ui-bridge"]

[build-dependencies]
cxx-qt-build = { version = "0.8", features = ["link_qt_object_files"] }
