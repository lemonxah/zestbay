name: Debian packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the .debs to (e.g. v1.1.2); empty builds the selected branch without attaching"
        required: false
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  deb:
    name: .deb (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Use this branch's packaging
        if: env.TAG != ''
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- pkg/

      - name: Build .deb
        run: pkg/deb/build-deb.sh --container "${{ matrix.image }}"

      - name: Build zestins .deb
        run: pkg/deb/build-zestins-deb.sh --container "${{ matrix.image }}"

      - name: Package the executables
        if: matrix.image == 'debian:12'
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          dir="zestbay-${version}-x86_64-linux"
          mkdir "$dir"
          install -m755 target/deb-debian-12/release/zestbay target/deb-debian-12/release/zestbay-ui-bridge "$dir/"
          strip "$dir/zestbay" "$dir/zestbay-ui-bridge"
          cp LICENSE "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - name: Package the zestins bundle
        if: matrix.image == 'debian:12'
        run: |
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          dir="zestins-${version}-x86_64-linux"
          mkdir "$dir"
          cp -r target/zestins-deb-debian-12/zestins.lv2 "$dir/"
          strip --strip-unneeded "$dir"/zestins.lv2/*.so
          cp LICENSE zestins/README.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"

      - name: Upload the executables
        if: matrix.image == 'debian:12'
        uses: actions/upload-artifact@v7
        with:
          name: executables-x86_64-linux
          path: |
            zestbay-*-x86_64-linux.tar.gz
            zestins-*-x86_64-linux.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ strategy.job-index }}
          path: pkg/deb/*.deb
          if-no-files-found: error

  publish:
    name: Attach .debs to release
    needs: deb
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum -- * > SHA256SUMS.deb
          gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
