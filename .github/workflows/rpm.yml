name: RPM packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the .rpms to (e.g. v1.1.2); empty builds the selected branch without attaching"
        required: false
        default: ""

permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  rpm:
    name: .rpm (${{ matrix.image }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG || github.ref }}

      - name: Use this branch's packaging
        if: env.TAG != ''
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout "$GITHUB_SHA" -- pkg/

      - name: Build .rpm
        run: pkg/rpm/build-rpm.sh --container "${{ matrix.image }}"

      - name: Build zestins .rpm
        run: pkg/rpm/build-zestins-rpm.sh --container "${{ matrix.image }}"

      - uses: actions/upload-artifact@v7
        with:
          name: rpm-${{ strategy.job-index }}
          path: |
            pkg/rpm/rpmbuild/RPMS/x86_64/zestbay-[0-9]*.rpm
            pkg/rpm/rpmbuild/RPMS/x86_64/zestins-[0-9]*.rpm
          if-no-files-found: error

  publish:
    name: Attach .rpms to release
    needs: rpm
    if: github.event_name == 'release' || inputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Upload release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -empty -delete
          sha256sum -- * > SHA256SUMS.rpm
          gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
